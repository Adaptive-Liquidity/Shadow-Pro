name: Security Baseline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Deterministic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tracked file sizes
        run: |
          limit_kib=1024
          oversized="$(
            find . \
              -path './.git' -prune -o \
              -path './target' -prune -o \
              -path './composer/node_modules' -prune -o \
              -type f -size +"${limit_kib}"k -print
          )"
          if [[ -n "$oversized" ]]; then
            echo "Tracked files larger than ${limit_kib} KiB are not allowed:" >&2
            echo "$oversized" >&2
            exit 1
          fi
          echo "All tracked files are within the ${limit_kib} KiB limit."

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: |
            README.md
            docs/**/*.md
            audit/**/*.md
            evidence/**/*.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch resolved 2026-08-18

      - name: Verify pinned Rust toolchain and components
        run: |
          rustc --version | grep -F '1.97.1'
          rustup component list --installed | grep -E '^rustfmt(-|$)'
          rustup component list --installed | grep -E '^clippy(-|$)'

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: composer/pnpm-lock.yaml

      - name: Reject credential material
        run: bash scripts/check_secrets.sh

      - name: Verify source lock is intentionally fail-closed
        run: node scripts/check_source_lock.mjs

      - name: Verify devnet readiness remains deny-by-default
        run: node scripts/check_devnet_readiness.mjs

      - name: Verify read-only devnet collector preflight
        run: |
          node --check scripts/collect_devnet_readiness_snapshot.mjs
          if node scripts/collect_devnet_readiness_snapshot.mjs >/tmp/shadow-devnet-collector.out 2>&1; then
            echo "collector must reject missing --agent before any network request"
            exit 1
          fi
          grep -q 'Missing required argument --agent' /tmp/shadow-devnet-collector.out

      - name: Verify Rust formatting
        run: cargo fmt --check

      - name: Lint Shadow Paymaster
        run: cargo clippy -p shadow_paymaster --all-targets -- -D warnings

      - name: Test Shadow Paymaster
        run: cargo test -p shadow_paymaster

      - name: Check Shadow Paymaster
        run: cargo check -p shadow_paymaster

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Install cargo-auditable
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build auditable Shadow Paymaster artifact
        run: cargo auditable build --locked -p shadow_paymaster

      - name: Install composer dependencies
        working-directory: composer
        run: pnpm install --frozen-lockfile

      - name: Build composer
        working-directory: composer
        run: pnpm build

      - name: Test composer
        working-directory: composer
        run: pnpm test

      - name: Audit composer dependencies
        working-directory: composer
        run: pnpm audit --prod --audit-level high

      - name: Generate SBOM and artifact hashes
        if: always()
        run: |
          mkdir -p artifacts/sbom
          (
            cd composer
            pnpm sbom --prod --sbom-format cyclonedx
          ) > artifacts/sbom/composer.cyclonedx.json
          sha256sum Cargo.lock composer/pnpm-lock.yaml artifacts/sbom/composer.cyclonedx.json > artifacts/sbom/SHA256SUMS

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadow-pro-sbom-${{ github.sha }}
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 30
